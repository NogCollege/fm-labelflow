            const height = parseFloat(document.getElementById('canvas-height').value) * baseScale;

            if (!skipHistory && !isRestoringHistory) {
                const currentWidth = parseFloat(canvas.style.width) / baseScale;
                const currentHeight = parseFloat(canvas.style.height) / baseScale;
                if (currentWidth !== width / baseScale || currentHeight !== height / baseScale) {
                    pushHistory();
                }
            }
            
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            
            updateCanvasInfo();
            rerenderAllElements();
            if (!skipHistory) scheduleSaveEditorState();
        }

        function updateCanvasInfo() {
            const info = document.getElementById('canvas-info');
            const width = document.getElementById('canvas-width').value;
            const height = document.getElementById('canvas-height').value;
            info.textContent = `${width}×${height} мм • ${elements.length} эл. • ${Math.round(viewportZoom * 100)}%`;
        }

        function rerenderAllElements() {
            const canvas = document.getElementById('label-canvas');
            canvas.innerHTML = '';
            
            elements.forEach(el => {
                renderElement(el);
            });
            
            if (selectedElement) {
                const selectedDiv = document.getElementById(`element-${selectedElement}`);
                if (selectedDiv) {
                    selectedDiv.classList.add('selected');
                }
            }
        }

        function exportElements() {
            return elements.map((el, index) => {
                const id = el.exportId || el.originalId || `${el.type || 'element'}_${Date.now()}_${index + 1}`;
                const x = Math.round(el.x * 10) / 10;
                const y = Math.round(el.y * 10) / 10;
                const width = Math.round(el.width * 10) / 10;
                const height = Math.round(el.height * 10) / 10;
                const orientation = Number.isFinite(el.orientation) ? el.orientation : 0;

                if (el.type === 'text') {
                    return {
                        id,
                        code: el.code || '',
                        type: el.type,
                        x,
                        y,
                        width,
                        height,
                        orientation,
                        exampleData: el.exampleData || '',
                        fontSize: Math.round((el.fontSize || 2) * 10) / 10,
                        align: el.align || 'L',
                        fontBold: !!el.fontBold,
                        fontItalic: !!el.fontItalic,
                        verticalText: !!el.verticalText,
                        lineSpacing: Number.isFinite(el.lineSpacing) ? el.lineSpacing : 1,
                        isStatic: el.isStatic !== false
                    };
                }

                if (el.type === 'image') {
                    return {
                        id,
                        code: el.code || '',
                        type: el.type,
                        x,
                        y,
                        width,
                        height,
                        orientation,
                        imageData: el.imageData || '',
                        isStatic: el.isStatic !== false
                    };
                }

                if (el.type === 'barcode') {
                    return {
                        id,
                        type: el.type,
                        x,
                        y,
                        width,
                        height,
                        code: el.code || '',
                        orientation,
                        barcodeType: el.barcodeType || 'gs1-datamatrix',
                        exampleData: el.exampleData || '',
                        barcodePrintValue: el.barcodePrintValue !== false,
                        isStatic: el.isStatic !== false
                    };
                }

                if (el.type === 'square' || el.type === 'line') {
                    return {
                        id,
                        code: el.code || '',
                        type: el.type,
                        x,
                        y,
                        width,
                        height,
                        orientation,
                        borderWidth: Number.isFinite(el.borderWidth) ? el.borderWidth : 10
                    };
                }

                return {
                    id,
                    code: el.code || '',
                    type: el.type,
                    x,
                    y,
                    width,
                    height,
                    orientation
                };
            });
        }

        async function _saveWithPickerOrDownload(blob, suggestedName) {
            if (window.showSaveFilePicker) {
                const ext = suggestedName.split('.').pop().toLowerCase();
                const typeMap = {
                    json: { description: 'JSON', accept: { 'application/json': ['.json'] } },
                    png: { description: 'PNG Image', accept: { 'image/png': ['.png'] } }
                };
                const pickerTypes = typeMap[ext] ? [typeMap[ext]] : undefined;
                const handle = await window.showSaveFilePicker({
                    suggestedName,
                    types: pickerTypes,
                    excludeAcceptAllOption: false
                });
                const writable = await handle.createWritable();
                await writable.write(blob);
                await writable.close();
                return true;
            }

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = suggestedName;
            a.click();
            URL.revokeObjectURL(url);
            return false;
        }

        async function saveJSON() {
            const width = parseFloat(document.getElementById('canvas-width').value);
            const height = parseFloat(document.getElementById('canvas-height').value);
            const exportedElements = exportElements();
            const timestamp = Date.now();

            const data = {
                name: `label_${timestamp}`,
                code: '',
                templateDefinition: {
                    canvas: {
                        width: width,
                        height: height
                    },
                    elements: exportedElements
                }
            };

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const filename = `label_${timestamp}.json`;
            try {
                await _saveWithPickerOrDownload(blob, filename);
                showStatus('JSON saved', 'success');
            } catch (err) {
                console.error('JSON save error:', err);
                showStatus('JSON save error', 'error');
            }
        }

        async function saveAsPNG() {
            showStatus('Создание PNG...', 'loading');
            
            const canvas = document.getElementById('label-canvas');
            const container = document.querySelector('.canvas-container');
            
            try {
                const hadGrid = container.classList.contains('grid-active');
                if (hadGrid) {
                    container.classList.remove('grid-active');
                }
                
                const originalTransform = canvas.style.transform;
                canvas.style.transform = 'scale(1)';
                
                const pngCanvas = await html2canvas(canvas, {
                    scale: 4,
                    backgroundColor: '#ffffff',
                    logging: false,
                    allowTaint: false,
                    useCORS: true,
                    windowWidth: canvas.offsetWidth,
                    windowHeight: canvas.offsetHeight,
                    onclone: (clonedDoc) => {
                        const clonedCanvas = clonedDoc.getElementById('label-canvas');
                        if (clonedCanvas) {
                            clonedCanvas.style.backgroundImage = 'none';
                            const clonedElements = clonedCanvas.querySelectorAll('.canvas-element');
                            clonedElements.forEach(el => {
                                el.style.border = 'none';
                                el.style.boxShadow = 'none';
                                el.style.background = 'transparent';
                                const handles = el.querySelectorAll('.resize-handle');
                                handles.forEach(h => h.style.display = 'none');
                            });
                        }
                    }
                });
                
                canvas.style.transform = originalTransform;
                if (hadGrid) {
                    container.classList.add('grid-active');
                }
                
                const dataUrl = pngCanvas.toDataURL('image/png');
                const pngBlob = await (await fetch(dataUrl)).blob();
                const filename = `label_${Date.now()}.png`;
                await _saveWithPickerOrDownload(pngBlob, filename);

                showStatus('PNG saved', 'success');
            } catch (err) {
                console.error('PNG error:', err);
                showStatus('Ошибка создания PNG', 'error');
            }
        }

            document.getElementById('json-input').click();
        }

        function handleCanvasDrop(event) {

        function showStatus(message, type) {
            const status = document.getElementById('json-status');
            status.className = 'status-message ' + type;
            status.textContent = message;
            status.style.display = 'block';
            
            setTimeout(() => {

        function getRequestedLayoutId() {
            const params = new URLSearchParams(window.location.search);
            return (params.get('layout') || '').trim();
        }

        function cleanupActiveLayout() {
            if (!activeLayoutId || layoutCleanupSent) {
                return;
            }

            layoutCleanupSent = true;
            const url = `/api/editor-layouts/${encodeURIComponent(activeLayoutId)}`;

            try {
                if (navigator.sendBeacon) {
                    const blob = new Blob(['{}'], { type: 'application/json' });
                    navigator.sendBeacon(url, blob);
                    return;
                }
            } catch (err) {
                console.error('sendBeacon cleanup failed:', err);
            }

            try {
                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: '{}',
                    keepalive: true
                }).catch(() => {});
            } catch (err) {
                console.error('fetch cleanup failed:', err);
            }
        }

        async function finalizeEditor() {
            if (!activeLayoutId) {
                window.close();
                return;
            }

            const url = `/api/editor-layouts/${encodeURIComponent(activeLayoutId)}`;
            layoutCleanupSent = true;

            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: '{}',
                    keepalive: true
                });
                showStatus('Временный JSON удален', 'success');
            } catch (err) {
                console.error('finalize cleanup failed:', err);
                showStatus('Не удалось удалить временный JSON', 'error');
                layoutCleanupSent = false;
                return;
            }

            setTimeout(() => {
                window.close();
            }, 150);
        }

        function resetEditorCanvas() {
            const canvas = document.getElementById('label-canvas');
            if (canvas) {
                canvas.innerHTML = '';
            }
            clearAlignmentGuides();
            elements = [];
            selectedElement = null;
            nextId = 1;
        }

        function openEmptyEditor() {
            resetEditorCanvas();
            clearHistory();
            document.getElementById('canvas-width').value = 58;
            document.getElementById('canvas-height').value = 60;
            updateCanvasSize(true);
            document.querySelector('.preview-panel h2').innerHTML = '🖼️ Холст этикетки';
            updateElementsList();
            updatePropertiesPanel();
            updateCanvasInfo();
            setTimeout(() => fitToScreen(), 100);
        }

        function normalizeIncomingData(data) {
            const payloadElements = Array.isArray(data.elements)
                ? data.elements
                : (data.templateDefinition && Array.isArray(data.templateDefinition.elements) ? data.templateDefinition.elements : []);

            const payloadSize = data.size || (data.templateDefinition ? {
                width_mm: data.templateDefinition.canvas && data.templateDefinition.canvas.width,
                height_mm: data.templateDefinition.canvas && data.templateDefinition.canvas.height
            } : null);

            return {
                elements: payloadElements,
                size: payloadSize,
                variantInfo: data.variant_info || null
            };
        }

        async function loadLayoutFromServer(layoutId) {
            const response = await fetch(`/api/editor-layouts/${encodeURIComponent(layoutId)}`, {
                cache: 'no-store'
            });
            if (!response.ok) {
                throw new Error(`Не удалось загрузить JSON (${response.status})`);
            }

            const data = await response.json();
            loadEditorData(data);
            return true;
        }

        async function bootEditor() {
            initCanvas();
            initDragAndDrop();
            initPanAndZoom();
            initKeyboardShortcuts();
            updateCanvasInfo();
            toggleGrid();

            const layoutId = getRequestedLayoutId();
            if (layoutId) {
                activeLayoutId = layoutId;
                layoutCleanupSent = false;
                // Coming from generator — clear old editor state, load fresh
                localStorage.removeItem(_EDITOR_STATE_KEY);
                try {
                    showStatus('Загрузка JSON из index.html...', 'loading');
                    await loadLayoutFromServer(layoutId);
                    return;
                } catch (err) {
                    console.error('Error loading remote layout:', err);
                    showStatus('Ошибка загрузки JSON: ' + err.message, 'error');
                }
            }

            // Restore previously saved editor state, or open empty
            if (!restoreEditorStateFromStorage()) {
                openEmptyEditor();
            }
        }

        window.addEventListener('pagehide', cleanupActiveLayout);
        window.addEventListener('beforeunload', cleanupActiveLayout);

        function loadEditorData(data) {
            console.log('loadEditorData вызван с данными:', data);
            resetEditorCanvas();

            const normalized = normalizeIncomingData(data);

            if (normalized.size) {
                document.getElementById('canvas-width').value = normalized.size.width_mm || 58;
                document.getElementById('canvas-height').value = normalized.size.height_mm || 60;
                updateCanvasSize(true);
            }

            if (normalized.elements.length) {
                normalized.elements.forEach(el => {
                    addElement(el);
                });
            }

            if (normalized.variantInfo) {
                const variantName = normalized.variantInfo.name || `Вариант ${normalized.variantInfo.index + 1}`;
                const variantIndex = normalized.variantInfo.index + 1;
                document.querySelector('h2').innerHTML = `🖼️ Холст этикетки - Вариант ${variantIndex}: ${variantName}`;
                showStatus(`Загружен вариант ${variantIndex}: ${variantName}`, 'success');
            } else {
                document.querySelector('h2').innerHTML = '🖼️ Холст этикетки';
                showStatus('JSON загружен', 'success');
            }

            updateElementsList();
            updatePropertiesPanel();
            updateCanvasInfo();
            clearHistory();
            setTimeout(() => fitToScreen(), 100);
        }

    </script>
    <script>
      // Heartbeat: пингуем сервер каждые 3 сек пока вкладка открыта.
      // Сервер завершится сам когда все вкладки закроются и пинги прекратятся.
      (function () {
        function ping() { fetch('/api/heartbeat', { method: 'POST' }).catch(function () {}); }
        ping();
        setInterval(ping, 3000);
      })();
    </script>
</body>
</html>
